source:
  dataset: brca_tcga_pan_can_atlas_2018
  study: cBioPortal BRCA TCGA PanCancer Atlas 2018
clinical_patient_features:
  - PATIENT_ID
  - AGE
  - SEX
  - CANCER_TYPE_ACRONYM
  - SUBTYPE
  - AJCC_PATHOLOGIC_TUMOR_STAGE
  - PATH_M_STAGE
clinical_sample_features:
  - SAMPLE_ID
  - PATIENT_ID
  - ONCOTREE_CODE
  - CANCER_TYPE
  - CANCER_TYPE_DETAILED
  - TUMOR_TYPE
  - ANEUPLOIDY_SCORE
  - SAMPLE_TYPE
derived_summary_features:
  mutation_record_count:
    source: data_mutations.txt
    definition: Raw MAF rows grouped by Tumor_Sample_Barcode; not a clinical MUTATION_COUNT field.
mutation_fields:
  - Hugo_Symbol
  - Entrez_Gene_Id
  - Tumor_Sample_Barcode
  - Variant_Classification
  - Variant_Type
  - Consequence
  - HGVSp_Short
  - HGVSc
  - Chromosome
  - Start_Position
  - End_Position
  - Reference_Allele
  - Tumor_Seq_Allele2
  - IMPACT
  - FILTER
  - NCALLERS
cna_fields:
  - Hugo_Symbol
  - Entrez_Gene_Id
  - discrete_sample_value
cna_policy:
  include_values: [-2, 2]
  exclude_neutral_value: 0

gene_panel: config/gene_panel_500.json
outcome_fields_excluded_from_evidence:
  - OS_STATUS
  - OS_MONTHS
  - DSS_STATUS
  - DSS_MONTHS
  - DFS_STATUS
  - DFS_MONTHS
  - PFS_STATUS
  - PFS_MONTHS
