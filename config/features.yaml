source:
  dataset: brca_tcga_pan_can_atlas_2018
  study: cBioPortal BRCA TCGA PanCancer Atlas 2018
clinical_patient_features:
  - PATIENT_ID
  - AGE
  - SEX
  - CANCER_TYPE_ACRONYM
  - SUBTYPE
  - AJCC_PATHOLOGIC_TUMOR_STAGE
  - PATH_M_STAGE
clinical_sample_features:
  - SAMPLE_ID
  - PATIENT_ID
  - ONCOTREE_CODE
  - CANCER_TYPE
  - CANCER_TYPE_DETAILED
  - TUMOR_TYPE
  - ANEUPLOIDY_SCORE
  - SAMPLE_TYPE
derived_summary_features:
  mutation_record_count:
    source: data_mutations.txt
    definition: Raw MAF rows grouped by Tumor_Sample_Barcode; not a clinical MUTATION_COUNT field.
mutation_fields:
  - Hugo_Symbol
  - Entrez_Gene_Id
  - Tumor_Sample_Barcode
  - Variant_Classification
  - Variant_Type
  - Consequence
  - HGVSp_Short
  - HGVSc
  - Chromosome
  - Start_Position
  - End_Position
  - Reference_Allele
  - Tumor_Seq_Allele2
  - IMPACT
  - FILTER
  - NCALLERS
cna_fields:
  - Hugo_Symbol
  - Entrez_Gene_Id
  - discrete_sample_value
cna_policy:
  include_values: [-2, 2]
  exclude_neutral_value: 0

gene_panel: config/gene_panel_500.json

# PrimeKG candidate depth is separate from the 3 GNN message-passing layers.
# fixed: use fixed_hops (1, 2, or 3). 0 keeps the patient graph only.
# gsl: retrieve max_candidate_hops, then learn an edge weight inside that bound.
primekg_fusion:
  mode: fixed
  fixed_hops: 2
  max_candidate_hops: 3
  gsl_enabled: false
  gsl_threshold: 0.5
  gsl_hard_prune: false
  gsl_patient_context: true
  gsl_node_scores: false
  gsl_hidden: 32
  gsl_relation_dim: 8
  gsl_temperature: 1.0
outcome_fields_excluded_from_evidence:
  - OS_STATUS
  - OS_MONTHS
  - DSS_STATUS
  - DSS_MONTHS
  - DFS_STATUS
  - DFS_MONTHS
  - PFS_STATUS
  - PFS_MONTHS
